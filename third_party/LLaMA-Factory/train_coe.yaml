### model
model_name_or_path: /shared/storage-01/jiarui14/chain-of-experts/CoE/checkpoints/DeepSeek-V2-Lite-CoE-iter8
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: config/deepspeed/ds_z3_offload_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
dataset: metamathqa
template: deepseek
cutoff_len: 3072
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4
dataset_dir: LLaMA-Factory/data

### output
output_dir: coe/checkpoints/DeepSeek-V2-Lite-CoE-iter8/metamathqa
logging_steps: 1
save_steps: 100
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb  # choices: [none, wandb, tensorboard, swanlab, mlflow]
run_name: DeepSeek-V2-Lite-CoE-iter8-metamathqa-sft

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: /shared/storage-01/jiarui14/chain-of-experts/LLaMA-Factory/coe/checkpoints/DeepSeek-V2-Lite-CoE-iter8/metamathqa/checkpoint-800

